name = "lift-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
# Comma-separated list of front-end addresses allowed to call this API (CORS)
ALLOWED_ORIGINS = "http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "lift-db"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
